<style>
  .Example1 {
    background-color: blue;
    padding-left: 10px;
    padding-right: 10px;
    padding-top: 10px;
    padding-bottom: 10px;
    border: none;
    color: white;
    border-radius: 1px;
    cursor: pointer;
    transition: padding-left 1s,
    padding-right 1s,
    padding-top 1s,
    padding-bottom 1s,
  }

  .Example1:hover{
    padding-left: 20px;
    padding-right: 20px;
    padding-top: 20px;
    padding-bottom: 20px;
  }

  .Example2 {
    background-color: red;
    padding-left: 10px;
    padding-right: 10px;
    padding-top: 10px;
    padding-bottom: 10px;
    border: none;
    color: white;
    border-radius: 1px;
    cursor: pointer;
    box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.15);
  }

  .Example2:active {
    margin-top: 3px;
    margin-right: 3px;
    box-shadow: none;
  }

  .Example3 {
    background-color: yellow;
    padding-left: 10px;
    padding-right: 10px;
    padding-top: 10px;
    padding-bottom: 10px;
    border: none;
    color: black;
    border-radius: 1px;
    cursor: pointer;
  }

  .Example3:hover {
    padding-left: 20px;
    padding-right: 20px;
  }
</style>


<div>
<button class="Example1">Example 1</button>
</div>
<br>
<br>
<div><button class="Example2">Example 2</button>
</div>
<br>
<br>
<div><button class="Example3">Example 3</button>
</div>
