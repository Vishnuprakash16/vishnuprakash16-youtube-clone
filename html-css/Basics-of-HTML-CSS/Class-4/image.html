<!DOCTYPE html>
<html>
  <head>
    <title>Image</title>
    <style>
      .cat {
        border-radius: 10px;
        width: 300px;
        margin-bottom: 20px;
        margin-right: 20px;
      }

      .cat2 {
        width: 200px;
        height: 200px;
        object-fit: cover;
        object-position: center;
      }

      .cat3 {
        width: 200px;
        height: 200px;
        border-radius: 100px;
        object-fit: cover;
        object-position: center;
      }
    </style>
    <body>
      <img class="cat" src="../../thumbnail/cat.webp">
      <img class="cat2" src="../../thumbnail/cat.webp">
      <img class="cat3" src="../../thumbnail/cat.webp">
    </body>
  </head>
</html>
